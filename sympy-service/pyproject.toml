[project]
name = "nerdicard-sympy"
version = "1.0.0"
description = "SymPy-backed math microservice for NerdCard"
requires-python = ">=3.12"
dependencies = [
    "sympy==1.13.3",
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
    "pydantic==2.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]
